<!DOCTYPE html>
<html lang="fi">
<head>
    <link rel="stylesheet" href="tyylit_index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    
</head>
<body>



    <div class="otsikko">
        <h1>Portfolion etusivu</h1>
    </div>

    <div class="navbar">
        <a href="elementtejä.html">HTML-elementtejä sivu.</a>
        <a href="tyylisivuista.html">Tyylisivu</a>
        <a href="muotoiluja.html">Muotoiluja-sivu</a>
        <a href="toiminnollinen.html">Toiminnollinen sivu</a>
        <button class="button" onclick="tumma()">Tumma teema</button>
        <button class="button" onclick="vaalea()">Vaalea teema</button>
    </div>

    <div class="tekstit">
        <p>Tämä on Web-ohjelmoinnissa tehdyn Portfolion etusivu.</p>
        <p>Tämä muutos tehty vscodesa</p>
        <p>Tämä muutos tehty vscodessa kloonattuun repositorioon</p>
    </div>
   
    <div class="kuva">
        <img src="kuva1.jpg" alt="jees">
    </div>

    <script>
        function vaalea() {
            document.body.classList.remove('tumma');
            document.body.classList.add('vaalea');
            localStorage.setItem('theme', 'vaalea');
        }

        function tumma() {
            document.body.classList.remove('vaalea');
            document.body.classList.add('tumma');
            localStorage.setItem('theme', 'tumma');
        }
        window.onload = function() {
            const theme = localStorage.getItem('theme');
            if (theme) {
                document.body.classList.add(theme);
            } else {
                document.body.classList.add('vaalea');
            }
        }
    </script>
    
    
</body>
</html>
