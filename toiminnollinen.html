<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="tyylit_toiminnollinen.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="otsikko">
        <h1>Työn Alla</h1>
    </div>
    <div class="navbar">
        <a href="index.html">Portfolion etusivu</a>
        <a href="elementtejä.html">HTML-elementtejä sivu</a>
        <a href="muotoiluja.html">Muotoiluja-sivu</a>
        <a href="tyylisivuista.html">Tyylisivu</a>
        <button class="button" onclick="tumma()">Tumma teema</button>
        <button class="button" onclick="vaalea()">Vaalea teema</button>
    </div>

    <div class="ohjelma">
        <button type="button"
        onclick="document.getElementById('demo').innerHTML = Date()">
        Paina näyttääksesi päivän ja ajan.</button>
        <p id="demo"></p>

    </div>

    <script>
        function vaalea() {
            document.body.classList.remove('tumma');
            document.body.classList.add('vaalea');
            localStorage.setItem('theme', 'vaalea');
        }

        function tumma() {
            document.body.classList.remove('vaalea');
            document.body.classList.add('tumma');
            localStorage.setItem('theme', 'tumma');
        }
        window.onload = function() {
            const theme = localStorage.getItem('theme');
            if (theme) {
                document.body.classList.add(theme);
            } else {
                document.body.classList.add('vaalea');
            }
        }
    </script>
    
</body>
</html>
